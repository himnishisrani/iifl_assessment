services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales
      POSTGRES_DB: sales
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales"]
      interval: 3s
      retries: 20

  loader:               # one-off: docker compose run --rm loader
    build: .
    profiles: ["tools"]
    command: python load_data.py
    volumes:
      - ./data:/app/data
    environment:
      DATABASE_URL: postgresql+psycopg2://sales:sales@db:5432/sales
    depends_on:
      db: {condition: service_healthy}

  app:
    build: .
    ports: ["8501:8501"]
    environment:
      DATABASE_URL: postgresql+psycopg2://sales:sales@db:5432/sales
    depends_on:
      db: {condition: service_healthy}

volumes:
  pgdata: